# Build system configuration
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell Hatch where to find the package code. The "src" part is the directory,
# and "crypto_portfolio_tracker" is the name of the package inside it.
packages = ["src/crypto_portfolio_tracker"]

# Project metadata and dependencies
[project]
name = "crypto-portfolio-tracker"
version = "2.1.0"
requires-python = ">=3.10"
dependencies = [
    # HTTP clients
    "httpx>=0.27",
    "requests>=2.31",

    # Data processing
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-ta>=0.3",  # Technical analysis

    # Financial data
    "yfinance>=0.2",
    "python-binance>=1.0",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",

    # File handling
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",

    # Utilities
    "diskcache>=5.6",      # Caching
    "python-dotenv>=1.0",  # Environment variables
    "jinja2>=3.1",         # Templating
    "pytz>=2024.1",        # Timezone handling
    "colorlog>=6.8",       # Colored logging
    "tqdm>=4.66",          # Progress bars
    "tenacity>=8.3.0",       # Retry logic
    "setuptools<81",       # Build compatibility
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",        # Linting and formatting
]

# CLI entry point
[project.scripts]
track-portfolio = "crypto_portfolio_tracker.__main__:main"

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-p pytest_mock"
filterwarnings = [
    "ignore:.*pkg_resources is deprecated.*:UserWarning",
    "ignore:.*websockets.WebSocketClientProtocol is deprecated.*:DeprecationWarning",
    "ignore:.*websockets.legacy is deprecated.*:DeprecationWarning",
]
markers = [
    "asyncio: mark test as async",
]

# Code formatting and linting
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # Error, pyflakes, warning, import sorting
ignore = ["E501"]              # Ignore line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
